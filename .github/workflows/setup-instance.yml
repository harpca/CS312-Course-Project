# This is a basic workflow that is manually triggered

name: Setup EC2 Instance workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Person to greet'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: us-east-1
  PRIVATE_KEY: |
    ${{ secrets.SSH_PRIVATE_KEY }}
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Sends a copy of the repository to the runner
    - name: Checkout repository
      uses: actions/checkout@v4
    # Creates the EC2 instance and gets the public IP address
    - name: Create instance
      run: | 
        echo MC_INSTANCE=$(aws ec2 run-instances \
        --image-id ami-0b183bb1259186479 \
        --count 1 \
        --instance-type t4g.small \
        --key-name MC-Key \
        --security-group-ids sg-04761a3598cb75765 \
        --subnet-id subnet-06eccdfee04a99646 \
        --query "Instances[0].InstanceId" \
        --output text \
        --tag-specifications 'ResourceType=instance, Tags=[{Key=Name, Value=Minecraft-Server-AUTO}]') >> "$GITHUB_ENV"
    - name: Wait for instance to start
      run: aws ec2 wait instance-running --instance-ids "$MC_INSTANCE"
    - name: Get the instance IP
      run: | 
        echo MC_IP=$(aws ec2 describe-instances \
        --instance-ids "$MC_INSTANCE" \
        --query "Reservations[*].Instances[*].PublicIpAddress" \
        --output text) >> "$GITHUB_ENV"
      # Creates the Ansible hosts.ini file with with the IP address
    - name: Create hosts.ini
      run: echo -e "[mcservers]\n$MC_IP\n" > hosts.ini
      # Install and update Ansible
    - name: Install Ansible
      run: |
        sudo apt update
        sudo apt install -y ansible
    - name: Create private key to talk to the runner
      run: |
        echo "$PRIVATE_KEY" > MC-Key.pem
        chmod 600 MC-Key.pem
    - name: Run Ansible playbook
      run: |
        export ANSIBLE_HOST_KEY_CHECKING=False
        ansible-playbook -i hosts.ini Playbook/install-MC.yml --private-key MC-Key.pem
    
